# Kluris 3 checks on every pull request and on pushes to main and v3: format,
# clippy and the Rust tests on the three OSes, the line-coverage gate, the
# third-party license report, dist's plan, and the release installers built
# and run on each OS. The parity suite is parity.yml; releases are
# release.yml (generated by dist).

name: CI

on:
  pull_request:
  push:
    branches: [main, v3]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --all --check

  test:
    name: clippy and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2
      # SPEC: at least 85% of the lines of kluris-core and kluris (the CLI).
      - run: cargo llvm-cov --workspace --exclude xtask --fail-under-lines 85 --summary-only

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      # THIRD_PARTY_LICENSES.md matches the crates in Cargo.lock.
      - run: scripts/release/licenses.sh --check

  dist-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      # release.yml keeps dist's tag trigger: no workflow here may reach PyPI.
      - name: no workflow publishes to PyPI (v2's publish.yml stays out)
        run: scripts/release/check_workflows.sh
      - name: dist plan (8 targets, installers, archives) and release.yml up to date
        run: |
          dist=$(scripts/release/tool.sh dist)
          "$dist" plan --output-format=json > "$RUNNER_TEMP/plan.json"
          python3 -I scripts/release/check_dist_plan.py "$RUNNER_TEMP/plan.json"
          "$dist" generate --check
      # release-notes.yml's body rewrite, on the fixture and on this plan
      - name: release notes lead with the site's install commands
        run: |
          python3 -I -m unittest discover -s scripts/release -p 'test_*.py'
          python3 -I scripts/release/release_notes.py "$RUNNER_TEMP/plan.json" > /dev/null

  installer-smoke:
    name: installer smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The site's install.sh / install.ps1, which the smoke runs too.
      - uses: actions/checkout@v6
        with:
          repository: ngvoicu/kluris-site
          path: site
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: build a local release and install it (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          scripts/release/build-local.sh
          scripts/release/installer-smoke.sh target/distrib
          scripts/release/installer-smoke.sh --wrapper site/install.sh target/distrib
      # The installed life cycle: 3.0.0 installed by its own installer,
      # self-update to 3.0.1 through a local fake release API, self-uninstall
      # (and KLURIS_NO_MODIFY_PATH=1, an rc file that cannot be rewritten).
      - name: the installed life cycle (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          scripts/release/build-versions.sh target/releases 3.0.0 3.0.1
          scripts/release/lifecycle-smoke.sh target/releases 3.0.0 3.0.1
      - name: build a local release and install it (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\build-local.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = (Get-Command python).Source
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\installer-smoke.ps1 -Release target\distrib -Python $python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\installer-smoke.ps1 -Release target\distrib -Python $python -Wrapper site\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: the installed life cycle (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\build-versions.ps1 -Out target\releases -Versions 3.0.0,3.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = (Get-Command python).Source
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\lifecycle-smoke.ps1 -Releases target\releases -Old 3.0.0 -New 3.0.1 -Python $python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
