[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax). The shell
# installer takes the gnu build when the host's glibc is new enough, else the
# static musl one.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in: not ~/.local/bin, which pipx
# and uv (and so a Kluris 2 install) also use
install-path = "~/.kluris/bin"
# What the installers print once the binary is in place
install-success-msg = "kluris installed. Open a new terminal, then run: kluris doctor"
# Where to host releases
hosting = "github"
# Whether to install an updater program (`kluris self-update` is built in)
install-updater = false
# tar.gz, not dist's .tar.xz: self_update's signature checks read zip and tar.gz
unix-archive = ".tar.gz"
windows-archive = ".zip"
# A <archive>.sha256 per archive and one sha256.sum
checksum = "sha256"
# Sigstore attestations, checked with `gh attestation verify`
github-attestations = true
# On a pull request, plan only
pr-run-mode = "plan"
# After dist announces the release, release-notes.yml rewrites its body to
# lead with the site's two install commands (dist's body has no template)
post-announce-jobs = ["./release-notes"]
# Every archive carries the license, the README, the ported code's notices
# and the licenses of the Rust dependencies built into `kluris` (generated by
# scripts/release/licenses.sh). Listed by hand: dist's auto-include resolves
# the crate's `license-file = "../../LICENSE"` from the wrong folder.
auto-includes = false
include = ["LICENSE", "README.md", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.md"]
# Build only the `kluris` package, not the whole workspace (xtask)
precise-builds = true

# dist's defaults, except: arm builds on arm runners (Ubuntu 22.04, the
# glibc floor of the x86_64 gnu build), macos-14 is deprecated, and
# Windows Server 2025 for x86_64
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
aarch64-unknown-linux-musl = "ubuntu-22.04-arm"
aarch64-pc-windows-msvc = "windows-11-arm"
x86_64-pc-windows-msvc = "windows-2025"
