[workspace]
resolver = "3"
members = ["crates/kluris-core", "crates/kluris-cli", "xtask"]

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
repository = "https://github.com/ngvoicu/kluris"

[workspace.dependencies]
kluris-core = { path = "crates/kluris-core" }
clap = { version = "4.6", features = ["derive"] }
include_dir = "0.7.4"
indexmap = "2.14"
jiff = "0.2.35"
num-bigint = "0.5.1"
regex = "1.13"
rust-stemmers = "1.2"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.12"
serde_json = { version = "1.0", features = ["preserve_order"] }
base64 = "0.22"
signal-hook = "0.3"
assert_cmd = "2.2"
assert_fs = "1.1"
predicates = "3.1"
tempfile = "3"
insta = "1.43"
