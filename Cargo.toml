[workspace]
resolver = "3"
members = ["crates/kluris-core", "crates/kluris-cli", "xtask"]

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
repository = "https://github.com/ngvoicu/kluris"

[workspace.dependencies]
kluris-core = { path = "crates/kluris-core" }
clap = { version = "4.6", features = ["derive"] }
indexmap = "2.14"
yaml-rust2 = "0.13"
assert_cmd = "2.2"
assert_fs = "1.1"
predicates = "3.1"
tempfile = "3"
