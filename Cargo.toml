[workspace]
resolver = "3"
members = ["crates/kluris-core", "crates/kluris-cli", "xtask"]

[workspace.package]
version = "3.1.1"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
repository = "https://github.com/ngvoicu/kluris"

[workspace.dependencies]
kluris-core = { path = "crates/kluris-core" }
clap = { version = "4.6", features = ["derive"] }
include_dir = "0.7.4"
indexmap = "2.14"
jiff = "0.2.35"
num-bigint = "0.5.1"
regex = "1.13"
rust-stemmers = "1.2"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.12"
serde_json = { version = "1.0", features = ["preserve_order"] }
base64 = "0.22"
signal-hook = "0.3"
self_update = { version = "1.3.2", default-features = false, features = ["github", "ureq", "rustls", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "checksums"] }
self-replace = "1.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
assert_cmd = "2.2"
assert_fs = "1.1"
predicates = "3.1"
tempfile = "3"
rustix = { version = "1.1.5", features = ["fs", "process", "std"] }
insta = "1.43"
wiremock = "0.6.5"
tokio = { version = "1.54", features = ["rt-multi-thread"] }
tar = "0.4.46"
flate2 = "1.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
