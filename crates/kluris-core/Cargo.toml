[package]
name = "kluris-core"
description = "Kluris 3 core library: every brain operation, no printing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
# Kluris 3 ships from GitHub Releases, never crates.io
publish = false

[dependencies]
include_dir.workspace = true
indexmap.workspace = true
jiff.workspace = true
num-bigint.workspace = true
regex.workspace = true
serde_json.workspace = true
rust-stemmers.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true

# The uninstall pre-flight's access checks (faccessat with AT_EACCESS) and
# killing a timed-out git's process group; already in the graph through
# tempfile.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true
# The interrupt handler that ends a run's process groups before the command
# dies of the signal (sigaction, killpg, raise); already in the graph
# through signal-hook.
libc.workspace = true

# A timed-out git's process tree ends with its job object.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
insta.workspace = true
# The format properties; std alone (no forking or timeouts), so no
# rusty-fork or wait-timeout.
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json.workspace = true
tempfile.workspace = true
